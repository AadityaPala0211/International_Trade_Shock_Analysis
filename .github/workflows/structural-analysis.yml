name: Network structural analysis
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Run threshold diagnostics or build empirical real networks
        required: true
        default: threshold
        type: choice
        options: [threshold, real]
      threshold:
        description: Analyst-reviewed common threshold (required for real stage)
        required: false
        default: ""
        type: string
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r code/network_structural_analysis/requirements.txt
      - name: Threshold review
        if: inputs.stage == 'threshold'
        run: PYTHONPATH=code python -m network_structural_analysis.run_pipeline --stage threshold --data-dir data --out results_network_analysis
      - name: Real network analysis
        if: inputs.stage == 'real'
        env:
          SELECTED_THRESHOLD: ${{ inputs.threshold }}
        run: |
          if [[ -z "$SELECTED_THRESHOLD" ]]; then
            echo "The real stage requires an analyst-selected threshold from the threshold diagnostics."
            exit 1
          fi
          PYTHONPATH=code python -m network_structural_analysis.run_pipeline --stage real --data-dir data --out results_network_analysis --threshold "$SELECTED_THRESHOLD"
      - uses: actions/upload-artifact@v4
        with:
          name: network-analysis-${{ inputs.stage }}
          path: results_network_analysis/
          if-no-files-found: error

name: Structural analysis tests
on:
  push:
    branches: [main, network-structural-analysis, Structural_analysis]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r code/network_structural_analysis/requirements.txt
      - run: PYTHONPATH=code python -m unittest discover -s code/network_structural_analysis/tests -v
      - run: python -m compileall -q code/network_structural_analysis
